version: '3'

# Docs tasks: yard HTML generation + lightweight checks.
# Cross-file dep-free.

tasks:
  docs:yard:
    desc: >-
      Generate the YARD HTML documentation under doc/yard/. Reads
      .yardopts at repo root for source globs + extras (README,
      ARCHITECTURE, UPGRADING, CHANGELOG, COOKBOOK).
    cmds:
      - bundle exec yard doc

  docs:yard:check:
    desc: >-
      Run yardoc with --no-output to confirm zero parse errors on
      the public API surface; CI-friendly (no HTML written, just
      validates parseability).
    cmds:
      - bundle exec yard doc --no-output

  docs:yard:stats:
    desc: >-
      Print YARD documentation coverage stats. Useful for tracking
      which public API methods still lack doc comments.
    cmds:
      - bundle exec yard stats --list-undoc

  docs:leak-check:
    desc: >-
      Scan every tracked file for internal planning vocabulary that
      must not ship in the public repo (milestone tags, private note
      names, local-only doc-tree paths), including split
      directory-tree renderings in Markdown. Exemptions live in
      .leakcheck-allow at the repo root; every entry needs a trailing
      justification comment. Nonzero exit on any unallowed hit.
    cmds:
      - ruby scripts/leak_check.rb

  docs:wcag:
    desc: >-
      Run WCAG 2.1 AA accessibility audit on the HTML reporter via
      axe-core. Requires Node + Chrome (auto-installs ChromeDriver
      via browser-driver-manager on first run).
      Generates testsift_report/ first if missing by running
      task test:features:rails.
    cmds:
      - test -f testsift_report/index.html || task test:features:rails
      - npx --yes @axe-core/cli "file://$(pwd)/testsift_report/index.html" --tags wcag2aa,wcag21aa --timeout 240
