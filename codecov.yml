# Codecov configuration. PR gates run as commit-status checks; the
# Codecov bot also drops a comment with the per-PR delta + diff
# coverage summary. Documentation: https://docs.codecov.com/docs/codecovyml-reference
#
# SimpleCov collates the resultsets uploaded by every per-suite CI
# job (lint-and-specs.yml `coverage` aggregator) into one Cobertura
# report, `coverage/coverage.xml`. Cobertura is the format whose
# per-line branch data (`condition-coverage`) Codecov's parser reads;
# Codecov ignores the `branches` key of SimpleCov's JSON output. A
# line with an untaken branch counts as a partial, which lowers both
# the project and the patch ratio below.

codecov:
  require_ci_to_pass: false
  notify:
    # Only the `coverage` aggregator uploads, once per commit, after
    # collating every test-* job's resultset; the per-suite jobs
    # upload nothing to Codecov.
    after_n_builds: 1

coverage:
  precision: 2
  round: nearest
  range: "85...100"
  status:
    project:
      default:
        # No coverage drop on the default branch. Threshold 0% allows fluctuation
        # within rounding precision but anything that meaningfully
        # lowers project coverage trips the status check.
        target: auto
        threshold: 0%
        if_ci_failed: error
        only_pulls: false
    patch:
      default:
        # Per-PR diff coverage gate: 90% of the patch's added /
        # modified lines must be covered. Picks up genuine test debt
        # accumulating in PRs without forcing the project baseline
        # to climb.
        target: 90%
        threshold: 0%
        if_ci_failed: error

# PR comment shape. `condensed` keeps the Files section compact
# (one row per file with delta) so review focus stays on changed
# code, not the full 200-file surface.
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Excluded paths must mirror spec/spec_helper.rb's SimpleCov config +
# scripts/merge_coverage.rb so the server-side report converges with
# the local one.
ignore:
  - "spec/"
  - "benchmark/"
  - "vendor/"
  - "tmp/"
  - "coverage/"
  - "lib/testsift/reporters/html/"
  # Metadata-only file. The single VERSION constant assignment fires
  # at gem load time; SimpleCov's per-suite collate path treats it
  # as 0% covered on a version bump, tripping the patch gate every
  # release. Same category as CHANGELOG / README — not behavior, not
  # test surface.
  - "lib/testsift/version.rb"
