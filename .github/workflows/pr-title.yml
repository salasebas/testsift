name: pr-title

# release-please derives versions and CHANGELOG entries from the commit
# messages that land on `testsift`. Pull requests are squash-merged with
# their title as the commit subject, so the title must be a Conventional
# Commit (`feat: ...`, `fix(storage): ...`, `feat!: ...`).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
