name: release

# release-please keeps a release pull request open against `testsift`
# with the next version bump and CHANGELOG entry, computed from the
# Conventional Commit messages merged since the last release. Merging
# that pull request tags `vX.Y.Z`, creates the GitHub release, and
# hands off to `publish`. Configuration: release-please-config.json and
# .release-please-manifest.json. Procedure: RELEASING.md.
#
# Tags and pull requests created with GITHUB_TOKEN do not trigger other
# workflows, so publishing runs here, gated on `release_created`,
# rather than in a separate tag-push workflow. `workflow_dispatch`
# publishes an existing release tag with the current workflow, for
# when a publish failed after the tag was created.

on:
  push:
    branches: [testsift]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.0.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish ${{ inputs.tag || needs.release-please.outputs.tag_name }} to RubyGems
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment to approve each
    # publish by hand; the RubyGems trusted publisher can also be
    # restricted to it.
    environment: rubygems
    permissions:
      contents: read
      id-token: write  # RubyGems trusted publishing exchanges the OIDC token
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lib/testsift/reporters/html/package-lock.json

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4

      - name: Validate tag matches TestSift::VERSION
        run: |
          gem_version=$(ruby -Ilib -rtestsift/version -e 'print TestSift::VERSION')
          if [ "$TAG" != "v${gem_version}" ]; then
            echo "::error::tag ${TAG} does not match TestSift::VERSION ${gem_version}"
            exit 1
          fi
          echo "VERSION=${gem_version}" >> "$GITHUB_ENV"

      - name: Build and verify the gem from the built artifact
        run: task release:verify

      # Same exchange as rubygems/configure-rubygems-credentials, plus
      # `owner`: RubyGems.org requires it when a pending trusted publisher
      # creates a new gem, and that action (v2.1.0) cannot send it yet.
      # The key is scoped to push_rubygem and expires after 15 minutes.
      - name: Publish to RubyGems
        env:
          RUBYGEMS_OWNER: sebastiansala
        run: |
          id_token=$(curl --fail-with-body -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::${id_token}"
          if ! response=$(jq -n --arg jwt "$id_token" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' \
            | curl --fail-with-body -sS -X POST \
                -H 'content-type: application/json' -H 'accept: application/json' \
                --data @- https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token); then
            echo "::error::RubyGems trusted publisher token exchange failed: ${response}"
            exit 1
          fi
          api_key=$(jq -r .rubygems_api_key <<< "$response")
          echo "::add-mask::${api_key}"
          GEM_HOST_API_KEY="$api_key" gem push "pkg/testsift-${VERSION}.gem"
