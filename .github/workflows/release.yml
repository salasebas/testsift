name: release

# release-please keeps a release pull request open against `testsift`
# with the next version bump and CHANGELOG entry, computed from the
# Conventional Commit messages merged since the last release. Merging
# that pull request tags `vX.Y.Z`, creates the GitHub release, and
# hands off to `publish`. Configuration: release-please-config.json and
# .release-please-manifest.json. Procedure: RELEASING.md.
#
# Tags and pull requests created with GITHUB_TOKEN do not trigger other
# workflows, so publishing runs here, gated on `release_created`,
# rather than in a separate tag-push workflow.

on:
  push:
    branches: [testsift]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish ${{ needs.release-please.outputs.tag_name }} to RubyGems
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment to approve each
    # publish by hand; the RubyGems trusted publisher can also be
    # restricted to it.
    environment: rubygems
    permissions:
      contents: read
      id-token: write  # RubyGems trusted publishing exchanges the OIDC token
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lib/testsift/reporters/html/package-lock.json

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4

      - name: Validate tag matches TestSift::VERSION
        run: |
          gem_version=$(ruby -Ilib -rtestsift/version -e 'print TestSift::VERSION')
          if [ "$TAG" != "v${gem_version}" ] || [ "$VERSION" != "$gem_version" ]; then
            echo "::error::tag ${TAG} (release ${VERSION}) does not match TestSift::VERSION ${gem_version}"
            exit 1
          fi

      - name: Build and verify the gem from the built artifact
        run: task release:verify

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        run: gem push "pkg/testsift-${VERSION}.gem"
