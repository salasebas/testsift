---
# yamllint configuration for testsift.
# The defaults flag GitHub Actions' `on:` key as a truthy value and enforce
# an 80-column limit that workflow syntax routinely exceeds. Relax both.

extends: default

rules:
  truthy:
    # GitHub Actions workflows use `on:` as a structural key, not a boolean.
    allowed-values: ['true', 'false']
    check-keys: false
  line-length:
    max: 200
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable

ignore: |
  /coverage/
  /testsift_cache/
  /testsift_coverage/
  /testsift_report/
  /tmp/
  /vendor/
  /.bundle/
  node_modules/
  /spec/fixtures/
